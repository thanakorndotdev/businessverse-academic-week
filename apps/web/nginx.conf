server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    client_max_body_size 32k;
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header Cache-Control no-store always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /health { proxy_pass http://api:3000/health; access_log off; }
    location = /sitemap.xml {
        proxy_pass http://api:3000/api/meta/sitemap.xml;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @sitemap_fallback;
    }
    location @sitemap_fallback { try_files /sitemap.xml =503; }
    location = /llms.txt {
        proxy_pass http://api:3000/api/meta/llms.txt;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @llms_fallback;
    }
    location @llms_fallback { default_type "text/plain; charset=utf-8"; try_files /llms.txt =503; }
    location = /llms-full.txt { default_type "text/plain; charset=utf-8"; }
    location ~ ^/(admin|play|passport|join)(/|$) {
        try_files /index.html =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}
