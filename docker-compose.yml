name: businessverse
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: businessverse
      POSTGRES_DB: businessverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U businessverse -d businessverse]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://businessverse:${POSTGRES_PASSWORD}@db:5432/businessverse
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      APP_URL: ${APP_URL:-http://localhost:8080}
      PORT: 3000
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          bun,
          -e,
          "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [app]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        SITE_URL: ${APP_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/health]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]
  test-api:
    extends:
      service: api
    profiles: [test]
    restart: "no"
    command: [bun, /app/scripts/serve-test-api.ts]
    volumes:
      - ./scripts:/app/scripts:ro
    ports:
      - "127.0.0.1:3002:3000"

volumes:
  pgdata:
networks:
  app:
    driver: bridge
